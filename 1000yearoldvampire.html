<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thousand Year Old Vampire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&display=swap');

        body {
            background: linear-gradient(to bottom, #0a0606, #1a0f0f);
            font-family: 'Cinzel', serif;
        }

        .title {
            font-family: 'UnifrakturMaguntia', cursive;
        }

        .struck-text {
            text-decoration: line-through;
            opacity: 0.4;
            color: #9f7a7a;
        }

        .struck-card {
            opacity: 0.55;
        }

        .section-header {
            border-bottom: 3px solid #9c1c1c;
        }

        .memory-card, .diary-card {
            transition: all 0.3s ease;
            border: 2px solid #9c1c1c;
        }

        .memory-card:hover, .diary-card:hover {
            box-shadow: 0 0 15px #9c1c1c;
        }

        .list-item {
            transition: all 0.2s ease;
        }

        .gothic-button {
            background: #1a1111;
            border: 2px solid #9c1c1c;
            color: #e8d5c0;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .gothic-button:hover {
            border-color: #e63939;
            color: #ffffff;
        }

        .danger-button {
            background: #3a0d0d;
            border: 2px solid #9c1c1c;
            color: #e8d5c0;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .danger-button:hover {
            background: #9c1c1c;
            color: #ffffff;
        }
    </style>
</head>

<body class="text-[#e8d5c0] min-h-screen pb-12">
    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="title text-7xl text-[#9c1c1c] tracking-widest drop-shadow-md">THOUSAND YEAR OLD VAMPIRE</h1>
            <p class="text-[#9f7a7a] text-xl italic mt-2">the blood remembers... until it doesn't</p>
        </div>

        <!-- Name / Sheet Controls -->
        <div class="mb-10">
            <label class="block text-[#9f7a7a] text-lg mb-2 tracking-wider">YOUR NAME</label>

            <div class="flex flex-col lg:flex-row gap-4 items-stretch lg:items-center">
                <input id="name-input"
                       type="text"
                       class="w-full lg:max-w-lg bg-[#1a1111] border-2 border-[#9c1c1c] focus:border-[#e63939] text-3xl p-5 outline-none rounded-none">

                <div class="flex flex-col sm:flex-row gap-3">
                    <button onclick="startNewSheet()"
                            class="danger-button px-6 py-4 text-sm sm:text-base">
                        START NEW
                    </button>

                    <button onclick="exportJson()"
                            class="gothic-button px-6 py-4 text-sm sm:text-base">
                        EXPORT JSON
                    </button>

                    <button onclick="triggerImportJson()"
                            class="gothic-button px-6 py-4 text-sm sm:text-base">
                        IMPORT JSON
                    </button>

                    <input id="json-import-input"
                           type="file"
                           accept=".json,application/json"
                           class="hidden"
                           onchange="importJson(event)">
                </div>
            </div>
        </div>

        <!-- Four Lists – two rows -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">

            <!-- Row 1 Left: Skills -->
            <div>
                <h2 class="section-header text-3xl text-[#9c1c1c] pb-3 mb-4">SKILLS</h2>
                <div class="flex gap-3 mb-6">
                    <input id="skills-input" type="text" placeholder="new skill..."
                           class="flex-1 bg-[#1a1111] border border-[#9c1c1c] p-4 text-lg outline-none">
                    <button onclick="addItem('skills')"
                            class="bg-[#9c1c1c] hover:bg-[#e63939] w-12 flex items-center justify-center text-3xl leading-none text-white">+</button>
                </div>
                <ul id="skills-list" class="space-y-3 min-h-[200px]"></ul>
            </div>

            <!-- Row 1 Right: Resources -->
            <div>
                <h2 class="section-header text-3xl text-[#9c1c1c] pb-3 mb-4">RESOURCES</h2>
                <div class="flex gap-3 mb-6">
                    <input id="resources-input" type="text" placeholder="new resource..."
                           class="flex-1 bg-[#1a1111] border border-[#9c1c1c] p-4 text-lg outline-none">
                    <button onclick="addItem('resources')"
                            class="bg-[#9c1c1c] hover:bg-[#e63939] w-12 flex items-center justify-center text-3xl leading-none text-white">+</button>
                </div>
                <ul id="resources-list" class="space-y-3 min-h-[200px]"></ul>
            </div>

            <!-- Row 2 Left: Characters -->
            <div>
                <h2 class="section-header text-3xl text-[#9c1c1c] pb-3 mb-4">CHARACTERS</h2>
                <div class="flex gap-3 mb-6">
                    <input id="characters-input" type="text" placeholder="new character..."
                           class="flex-1 bg-[#1a1111] border border-[#9c1c1c] p-4 text-lg outline-none">
                    <button onclick="addItem('characters')"
                            class="bg-[#9c1c1c] hover:bg-[#e63939] w-12 flex items-center justify-center text-3xl leading-none text-white">+</button>
                </div>
                <ul id="characters-list" class="space-y-3 min-h-[200px]"></ul>
            </div>

            <!-- Row 2 Right: Marks -->
            <div>
                <h2 class="section-header text-3xl text-[#9c1c1c] pb-3 mb-4">MARKS</h2>
                <div class="flex gap-3 mb-6">
                    <input id="marks-input" type="text" placeholder="new mark..."
                           class="flex-1 bg-[#1a1111] border border-[#9c1c1c] p-4 text-lg outline-none">
                    <button onclick="addItem('marks')"
                            class="bg-[#9c1c1c] hover:bg-[#e63939] w-12 flex items-center justify-center text-3xl leading-none text-white">+</button>
                </div>
                <ul id="marks-list" class="space-y-3 min-h-[200px]"></ul>
            </div>
        </div>

        <!-- Memories -->
        <div class="mb-16">
            <div class="flex justify-between items-baseline mb-6">
                <h2 class="text-4xl text-[#9c1c1c] title">
                    MEMORIES <span id="memory-count" class="text-[#e63939] text-2xl">(0/5 active)</span>
                </h2>
                <button onclick="addMemory()"
                        class="bg-[#1a1111] border-2 border-[#9c1c1c] hover:border-[#e63939] px-8 py-4 text-xl font-bold">+ NEW MEMORY</button>
            </div>
            <div id="memories-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- Diary -->
        <div>
            <div class="flex justify-between items-baseline mb-6">
                <h2 class="text-4xl text-[#9c1c1c] title">
                    DIARY <span id="diary-count" class="text-[#e63939] text-2xl">(0/4)</span>
                </h2>
            </div>
            <div id="diary-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script>
        const emptySheet = {
            name: "",
            skills: [],
            resources: [],
            characters: [],
            marks: [],
            memories: [],
            diary: []
        };

        let data = createEmptySheet();

        function createEmptySheet() {
            return JSON.parse(JSON.stringify(emptySheet));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value);
        }

        function normalizeBasicItem(item) {
            return {
                id: item && item.id ? String(item.id) : generateId(),
                text: item && item.text ? String(item.text) : "",
                struck: Boolean(item && item.struck)
            };
        }

        function normalizeExperience(exp) {
            return {
                id: exp && exp.id ? String(exp.id) : generateId(),
                text: exp && exp.text ? String(exp.text) : "",
                struck: Boolean(exp && exp.struck)
            };
        }

        function normalizeMemory(memory) {
            return {
                id: memory && memory.id ? String(memory.id) : generateId(),
                name: memory && memory.name ? String(memory.name) : "New Memory",
                struck: Boolean(memory && memory.struck),
                experiences: Array.isArray(memory && memory.experiences)
                    ? memory.experiences.map(normalizeExperience)
                    : []
            };
        }

        function normalizeSheet(rawData) {
            const normalized = createEmptySheet();

            normalized.name = rawData && rawData.name ? String(rawData.name) : "";

            normalized.skills = Array.isArray(rawData && rawData.skills)
                ? rawData.skills.map(normalizeBasicItem)
                : [];

            normalized.resources = Array.isArray(rawData && rawData.resources)
                ? rawData.resources.map(normalizeBasicItem)
                : [];

            normalized.characters = Array.isArray(rawData && rawData.characters)
                ? rawData.characters.map(normalizeBasicItem)
                : [];

            normalized.marks = Array.isArray(rawData && rawData.marks)
                ? rawData.marks.map(normalizeBasicItem)
                : [];

            normalized.memories = Array.isArray(rawData && rawData.memories)
                ? rawData.memories.map(normalizeMemory)
                : [];

            normalized.diary = Array.isArray(rawData && rawData.diary)
                ? rawData.diary.map(normalizeMemory)
                : [];

            return normalized;
        }

        function loadData() {
            const saved = localStorage.getItem('tyov-sheet');

            if (saved) {
                try {
                    data = normalizeSheet(JSON.parse(saved));
                } catch (error) {
                    console.error("Could not load saved sheet.", error);
                    data = createEmptySheet();
                }
            } else {
                data = createEmptySheet();
            }

            document.getElementById('name-input').value = data.name || '';
        }

        function saveData() {
            localStorage.setItem('tyov-sheet', JSON.stringify(data));
        }

        function startNewSheet() {
            const confirmed = confirm("Start a new sheet? This will clear the current view and overwrite the browser autosave.");

            if (!confirmed) {
                return;
            }

            data = createEmptySheet();
            saveData();
            clearEntryInputs();
            document.getElementById('name-input').value = "";
            renderAll();
        }

        function clearEntryInputs() {
            ['skills', 'resources', 'characters', 'marks'].forEach(listName => {
                const input = document.getElementById(listName + '-input');

                if (input) {
                    input.value = "";
                }
            });
        }

        function exportJson() {
            const exportData = JSON.stringify(data, null, 2);
            const blob = new Blob([exportData], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const safeName = data.name
                ? data.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")
                : "thousand-year-old-vampire";

            const link = document.createElement("a");
            link.href = url;
            link.download = `${safeName || "thousand-year-old-vampire"}-sheet.json`;

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);
        }

        function triggerImportJson() {
            const input = document.getElementById('json-import-input');
            input.value = "";
            input.click();
        }

        function importJson(event) {
            const file = event.target.files && event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(loadEvent) {
                try {
                    const imported = JSON.parse(loadEvent.target.result);
                    data = normalizeSheet(imported);
                    saveData();

                    document.getElementById('name-input').value = data.name || "";
                    clearEntryInputs();
                    renderAll();
                } catch (error) {
                    console.error("Could not import JSON.", error);
                    alert("That JSON file could not be imported. Make sure it is a valid exported sheet.");
                }
            };

            reader.onerror = function() {
                alert("The JSON file could not be read.");
            };

            reader.readAsText(file);
        }

        function toggleStrike(listName, itemId) {
            if (listName === 'memories' || listName === 'diary') {
                const list = listName === 'memories' ? data.memories : data.diary;
                const item = list.find(i => i.id === itemId);

                if (item) {
                    item.struck = !item.struck;
                }
            } else {
                const list = data[listName];
                const item = list.find(i => i.id === itemId);

                if (item) {
                    item.struck = !item.struck;
                }
            }

            saveData();
            renderAll();
        }

        function deleteItem(listName, itemId) {
            if (listName === 'memories' || listName === 'diary') {
                const list = listName === 'memories' ? data.memories : data.diary;
                const idx = list.findIndex(i => i.id === itemId);

                if (idx > -1) {
                    list.splice(idx, 1);
                }
            } else {
                return;
            }

            saveData();
            renderAll();
        }

        function deleteExperience(memId, expId) {
            const memory = data.memories.find(m => m.id === memId);

            if (!memory) {
                return;
            }

            const idx = memory.experiences.findIndex(e => e.id === expId);

            if (idx > -1) {
                memory.experiences.splice(idx, 1);
            }

            saveData();
            renderAll();
        }

        function addItem(listName) {
            const input = document.getElementById(listName + '-input');
            const text = input.value.trim();

            if (!text) {
                return;
            }

            data[listName].push({
                id: generateId(),
                text,
                struck: false
            });

            input.value = '';
            saveData();
            renderAll();
        }

        function updateListItemText(listName, itemId, value) {
    const list = data[listName];

    if (!Array.isArray(list)) {
        return;
    }

    const item = list.find(i => i.id === itemId);

    if (!item) {
        return;
    }

    item.text = value;
    saveData();
}

function renderList(listName) {
    const container = document.getElementById(listName + '-list');

    if (!container) {
        return;
    }

    container.innerHTML = data[listName].map(item => `
        <li class="list-item flex gap-3 items-stretch">
            <div class="flex-1 bg-[#1a1111] border border-[#9c1c1c] p-4 flex items-center min-h-[58px]">
                <input type="text"
                       value="${escapeAttribute(item.text)}"
                       onblur="updateListItemText('${listName}', '${item.id}', this.value)"
                       class="w-full bg-transparent outline-none text-lg ${item.struck ? 'struck-text' : ''}">
            </div>

            <button onclick="toggleStrike('${listName}', '${item.id}');"
                    class="bg-[#1a1111] border border-[#9c1c1c] hover:bg-[#9c1c1c] hover:text-white text-sm px-4 sm:px-6 font-bold min-w-[110px]">
                ${item.struck ? 'UNSTRIKE' : 'STRIKE'}
            </button>
        </li>
    `).join('');
}

        function addMemory() {
            const active = data.memories.filter(m => !m.struck).length;

            if (active >= 5) {
                alert("You have reached the limit of 5 active memories.");
                return;
            }

            data.memories.push({
                id: generateId(),
                name: "New Memory",
                struck: false,
                experiences: []
            });

            saveData();
            renderAll();
        }

        function addExperience(memId) {
            const memory = data.memories.find(m => m.id === memId);

            if (!memory) {
                return;
            }

            const inputId = `exp-input-${memId}`;
            const input = document.getElementById(inputId);
            const text = input ? input.value.trim() : '';

            if (!text) {
                return;
            }

            memory.experiences.push({
                id: generateId(),
                text,
                struck: false
            });

            input.value = '';
            saveData();
            renderAll();
        }

        function toggleExpStrike(memId, expId) {
            const memory = data.memories.find(m => m.id === memId);

            if (!memory) {
                return;
            }

            const exp = memory.experiences.find(e => e.id === expId);

            if (exp) {
                exp.struck = !exp.struck;
            }

            saveData();
            renderAll();
        }

        function strikeMemory(memId) {
            const memory = data.memories.find(m => m.id === memId);

            if (!memory) {
                return;
            }

            memory.struck = !memory.struck;
            saveData();
            renderAll();
        }

        function turnToDiary(memId) {
            const idx = data.memories.findIndex(m => m.id === memId);

            if (idx === -1) {
                return;
            }

            const memory = data.memories[idx];
            const activeDiary = data.diary.filter(d => !d.struck).length;

            if (activeDiary >= 4) {
                alert("Diary can only hold 4 active entries.");
                return;
            }

            data.diary.push(memory);
            data.memories.splice(idx, 1);

            saveData();
            renderAll();
        }

        function updateMemoryName(memId, value) {
            const memory = data.memories.find(m => m.id === memId);

            if (!memory) {
                return;
            }

            memory.name = value;
            saveData();
        }

        function renderMemories() {
            const container = document.getElementById('memories-container');
            const activeCount = data.memories.filter(m => !m.struck).length;

            document.getElementById('memory-count').textContent = `(${activeCount}/5 active)`;

            container.innerHTML = data.memories.map(mem => `
                <div class="memory-card bg-[#1a1111] p-6 rounded-none ${mem.struck ? 'struck-card' : ''}">
                    <div class="flex justify-between items-center mb-4 gap-4">
                        <input type="text"
                               value="${escapeAttribute(mem.name)}"
                               onblur="updateMemoryName('${mem.id}', this.value)"
                               class="bg-transparent border-b-2 border-[#9c1c1c] focus:border-[#e63939] text-2xl flex-1 outline-none ${mem.struck ? 'struck-text' : ''}">

                        <div class="flex gap-3 ml-auto">
                            <button onclick="strikeMemory('${mem.id}')"
                                    class="text-sm px-4 py-2 border border-[#9c1c1c] hover:bg-[#9c1c1c] hover:text-white">
                                ${mem.struck ? 'UNSTRIKE' : 'STRIKE'}
                            </button>

                            <button onclick="turnToDiary('${mem.id}')"
                                    class="text-sm px-4 py-2 border border-[#9c1c1c] hover:bg-[#9c1c1c] hover:text-white">
                                TO DIARY
                            </button>

                            <button onclick="deleteItem('memories', '${mem.id}')"
                                    class="text-[#9f7a7a] hover:text-[#e63939] text-3xl">
                                ×
                            </button>
                        </div>
                    </div>

                    <div class="pl-4 border-l-2 border-[#9c1c1c] mb-4">
                        <div class="flex gap-2 mb-3">
                            <input id="exp-input-${mem.id}" type="text" placeholder="new experience..."
                                   class="flex-1 bg-[#0f0a0a] border border-[#9c1c1c] p-3 outline-none text-sm">
                            <button onclick="addExperience('${mem.id}')"
                                    class="bg-[#9c1c1c] hover:bg-[#e63939] px-6 text-xs font-bold">
                                ADD
                            </button>
                        </div>

                        <ul class="space-y-2">
                            ${(mem.experiences || []).map(exp => `
                                <li class="flex justify-between items-center bg-[#0f0a0a] p-3 text-sm">
                                    <button onclick="toggleExpStrike('${mem.id}', '${exp.id}')"
                                            class="text-left flex-1 ${exp.struck ? 'struck-text' : ''}">
                                        ${escapeHtml(exp.text)}
                                    </button>

                                    <button onclick="deleteExperience('${mem.id}', '${exp.id}')"
                                            class="ml-3 text-[#9f7a7a] hover:text-[#e63939]">
                                        ×
                                    </button>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        function renderDiary() {
            const container = document.getElementById('diary-container');
            const activeCount = data.diary.filter(d => !d.struck).length;

            document.getElementById('diary-count').textContent = `(${activeCount}/4)`;

            container.innerHTML = data.diary.map(diary => `
                <div class="diary-card bg-[#1a1111] p-6 rounded-none ${diary.struck ? 'struck-card' : ''}">
                    <div class="flex justify-between items-center mb-4 gap-4">
                        <div class="text-2xl flex-1 ${diary.struck ? 'struck-text' : ''}">
                            ${escapeHtml(diary.name)}
                        </div>

                        <div class="flex gap-3 ml-auto">
                            <button onclick="toggleStrike('diary', '${diary.id}')"
                                    class="text-sm px-4 py-2 border border-[#9c1c1c] hover:bg-[#9c1c1c] hover:text-white">
                                ${diary.struck ? 'UNSTRIKE' : 'STRIKE'}
                            </button>

                            <button onclick="deleteItem('diary', '${diary.id}')"
                                    class="text-[#9f7a7a] hover:text-[#e63939] text-3xl">
                                ×
                            </button>
                        </div>
                    </div>

                    <div class="pl-4 border-l-2 border-[#9c1c1c]">
                        <ul class="space-y-2 text-sm">
                            ${(diary.experiences || []).map(exp => `
                                <li class="flex justify-between bg-[#0f0a0a] p-3">
                                    <span class="${exp.struck ? 'struck-text' : ''}">
                                        ${escapeHtml(exp.text)}
                                    </span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        function renderAll() {
            renderList('skills');
            renderList('resources');
            renderList('characters');
            renderList('marks');
            renderMemories();
            renderDiary();
        }

        window.onload = function() {
            loadData();
            renderAll();

            const nameInput = document.getElementById('name-input');

            nameInput.addEventListener('input', () => {
                data.name = nameInput.value;
                saveData();
            });

            ['skills', 'resources', 'characters', 'marks'].forEach(listName => {
                const input = document.getElementById(listName + '-input');

                input.addEventListener('keydown', event => {
                    if (event.key === 'Enter') {
                        addItem(listName);
                    }
                });
            });
        };
    </script>
</body>
</html>
